# Every description under docs/connectors (the networks, then the services), written here by scripts/ship_connections.py
# and checked by tests/connectors_it.rs: a workspace sees each offered in Administration, Connections, turned off and
# without secrets. An account carried over from 0.6 (Mastodon, Bluesky) is given its connection from here.
connections:
