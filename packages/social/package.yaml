package: social
version: 0.1.0
label: Social
description: "Brands' social accounts through the platform's connections: posts approved by someone other than their author and sent at their time to each account, within what each network takes; the inbox answered; and what each post did"
depends: [core]

modules:
  - name: social
    label: Social
    icon: share-2
    order: 66
    # (round five) The app's own pages are the module's first rows (app.yaml shell.menu): Compose and Calendar
    # (posts), Posting times, Accounts, Media, Inbox (messages), Numbers, Library (templates, sets, snippets,
    # signatures, variables, link templates, saved replies), Automation (feeds and plugs) and Notices (opt-outs).
    # The generic rows those pages replace are gone; what no page shows stays here.
    items: [SocialBrand, SocialProfile, SocialReview, SocialPublication, SocialInsight, SocialMetric, SocialReply, SocialDigestRun, SocialWritingPreset, SocialWritingUse, SocialSettings]

roles:
  - name: Social Writing Help
    description: (round two) May ask writing help to write, rewrite, adapt, describe and draw; each use is kept.
    permissions:
      - {entity: SocialWritingPreset, read: true}
      - {entity: SocialWritingUse, read: true}
  - name: Social Author
    description: Writes posts and answers the inbox; someone else approves the posts.
    permissions:
      - {entity: SocialBrand, read: true}
      - {entity: SocialAccount, read: true}
      - {entity: SocialProfile, read: true}
      - {entity: SocialSavedReply, read: true}
      - {entity: SocialPostingTime, read: true}
      - {entity: SocialTemplate, read: true, write: true, create: true}
      - {entity: SocialSet, read: true, write: true, create: true}
      - {entity: SocialSnippet, read: true, write: true, create: true}
      - {entity: SocialSignature, read: true}
      - {entity: SocialVariable, read: true}
      - {entity: SocialReview, read: true}
      - {entity: SocialMediaAsset, read: true, write: true, create: true}
      - {entity: SocialLinkTemplate, read: true}
      - {entity: SocialPlug, read: true}
      - {entity: SocialNoticeOptOut, read: true, write: true, create: true, delete: true, via: person}
      - {entity: SocialPlugRun, read: true}
      - {entity: SocialPost, read: true, write: true, create: true, import: true}
      - {entity: SocialPublication, read: true}
      - {entity: SocialInsight, read: true}
      - {entity: SocialMetric, read: true}
      - {entity: SocialMessage, read: true, write: true}
      - {entity: SocialReply, read: true, create: true}
  - name: Social Approver
    description: Approves posts or sends them back, and sees what they did.
    permissions:
      - {entity: SocialBrand, read: true}
      - {entity: SocialAccount, read: true}
      - {entity: SocialProfile, read: true}
      - {entity: SocialSavedReply, read: true}
      - {entity: SocialPostingTime, read: true}
      - {entity: SocialTemplate, read: true}
      - {entity: SocialSet, read: true}
      - {entity: SocialSnippet, read: true}
      - {entity: SocialSignature, read: true}
      - {entity: SocialVariable, read: true}
      - {entity: SocialReview, read: true, export: true}
      - {entity: SocialMediaAsset, read: true}
      - {entity: SocialLinkTemplate, read: true}
      - {entity: SocialPlug, read: true}
      - {entity: SocialNoticeOptOut, read: true, write: true, create: true, delete: true, via: person}
      - {entity: SocialPlugRun, read: true}
      - {entity: SocialPost, read: true, write: true}
      - {entity: SocialPublication, read: true, write: true, export: true}
      - {entity: SocialInsight, read: true, export: true}
      - {entity: SocialMetric, read: true, export: true}
      - {entity: SocialMessage, read: true, write: true}
      - {entity: SocialReply, read: true}
  - name: Social Manager
    description: Keeps the brands and their accounts.
    permissions:
      - {entity: SocialBrand, read: true, write: true, create: true}
      - {entity: SocialAccount, read: true, write: true, create: true}
      - {entity: SocialProfile, read: true, write: true, create: true}
      - {entity: SocialSavedReply, read: true, write: true, create: true, delete: true}
      - {entity: SocialSettings, read: true, write: true, create: true}
      - {entity: SocialPostingTime, read: true, write: true, create: true, delete: true}
      - {entity: SocialTemplate, read: true, write: true, create: true, delete: true}
      - {entity: SocialSet, read: true, write: true, create: true, delete: true}
      - {entity: SocialSnippet, read: true, write: true, create: true, delete: true}
      - {entity: SocialSignature, read: true, write: true, create: true, delete: true}
      - {entity: SocialVariable, read: true, write: true, create: true, delete: true}
      - {entity: SocialReview, read: true}
      - {entity: SocialMediaAsset, read: true, write: true, create: true, delete: true}
      - {entity: SocialLinkTemplate, read: true, write: true, create: true, delete: true}
      - {entity: SocialWritingPreset, read: true, write: true, create: true, delete: true}
      - {entity: SocialWritingUse, read: true, export: true}
      - {entity: SocialPlug, read: true, write: true, create: true, delete: true}
      - {entity: SocialPlugRun, read: true, export: true}
      - {entity: SocialNoticeOptOut, read: true, write: true, create: true, delete: true, via: person}
      - {entity: SocialDigestRun, read: true}
      - {entity: SocialFeed, read: true, write: true, create: true, delete: true}
      - {entity: SocialFeedItem, read: true, export: true}
      - {entity: SocialPost, read: true}
      - {entity: SocialPublication, read: true, write: true, export: true}
      - {entity: SocialInsight, read: true, export: true}
      - {entity: SocialMetric, read: true, export: true}
      - {entity: SocialMessage, read: true, write: true}
      - {entity: SocialReply, read: true}

# What the inbox holds of the people who write to a brand: the handle, what they said and what was
# answered. A handle that is an address (name@host) is found by it; one that is not is listed under
# the name for a person to judge.
personal_data:
  - {entity: SocialMessage, match: author, name: author, erase: [author, author_id, account_handle, text, contact_id, contact_entity]}
  - {entity: SocialReply, match: message, erase: [text, in_reply_to]}
  # Who reviewed a post through its link (the address or name it was given for) and what they said.
  # (round two) The notices a person turned off.
  - {entity: SocialNoticeOptOut, match: person, erase: [person]}
  # (round two) What someone asked writing help, and what came back: it may hold anything they wrote.
  - {entity: SocialWritingUse, match: by, erase: [prompt, answer]}
  - {entity: SocialReview, match: reviewer, name: reviewer_name, erase: [reviewer, reviewer_name, text]}

# What the networks took in a post before network profiles were records: the same numbers, now
# editable. An account whose network is named like one of them is linked to it by the upkeep.
seed:
  - entity: SocialWritingPreset
    key: [preset_name]
    records:
      - {preset_name: Shorter, instruction: "Make it shorter, keeping what matters."}
      - {preset_name: Longer, instruction: "Make it longer, adding a useful detail, not filler."}
      - {preset_name: Friendlier, instruction: "Make it warmer and friendlier."}
      - {preset_name: More Formal, instruction: "Make it more formal."}
      - {preset_name: Fix Grammar, instruction: "Correct spelling and grammar only; change nothing else."}
  - entity: SocialProfile
    key: [profile_name]
