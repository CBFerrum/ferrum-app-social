package: social
version: 0.1.0
label: Social
description: "Brands' social accounts through the platform's connections: posts approved by someone other than their author and sent at their time to each account, within what each network takes; the inbox answered; and what each post did"
depends: [core]

modules:
  - name: social
    label: Social
    icon: share-2
    order: 66
    items: [SocialPost, SocialMessage, SocialAccount, SocialBrand, SocialPostingTime, SocialTemplate, SocialSet, SocialSnippet, SocialSignature, SocialVariable, SocialMediaAsset, SocialLinkTemplate, SocialWritingPreset, SocialWritingUse, SocialReview, SocialProfile, SocialPublication, SocialInsight, SocialMetric, SocialReply, SocialSavedReply, SocialSettings]

roles:
  - name: Social Writing Help
    description: (round two) May ask writing help to write, rewrite, adapt, describe and draw; each use is kept.
    permissions:
      - {entity: SocialWritingPreset, read: true}
      - {entity: SocialWritingUse, read: true}
  - name: Social Author
    description: Writes posts and answers the inbox; someone else approves the posts.
    permissions:
      - {entity: SocialBrand, read: true}
      - {entity: SocialAccount, read: true}
      - {entity: SocialProfile, read: true}
      - {entity: SocialSavedReply, read: true}
      - {entity: SocialPostingTime, read: true}
      - {entity: SocialTemplate, read: true, write: true, create: true}
      - {entity: SocialSet, read: true, write: true, create: true}
      - {entity: SocialSnippet, read: true, write: true, create: true}
      - {entity: SocialSignature, read: true}
      - {entity: SocialVariable, read: true}
      - {entity: SocialReview, read: true}
      - {entity: SocialMediaAsset, read: true, write: true, create: true}
      - {entity: SocialLinkTemplate, read: true}
      - {entity: SocialPost, read: true, write: true, create: true, import: true}
      - {entity: SocialPublication, read: true}
      - {entity: SocialInsight, read: true}
      - {entity: SocialMetric, read: true}
      - {entity: SocialMessage, read: true, write: true, create: true}
      - {entity: SocialReply, read: true, create: true}
  - name: Social Approver
    description: Approves posts or sends them back, and sees what they did.
    permissions:
      - {entity: SocialBrand, read: true}
      - {entity: SocialAccount, read: true}
      - {entity: SocialProfile, read: true}
      - {entity: SocialSavedReply, read: true}
      - {entity: SocialPostingTime, read: true}
      - {entity: SocialTemplate, read: true}
      - {entity: SocialSet, read: true}
      - {entity: SocialSnippet, read: true}
      - {entity: SocialSignature, read: true}
      - {entity: SocialVariable, read: true}
      - {entity: SocialReview, read: true, export: true}
      - {entity: SocialMediaAsset, read: true}
      - {entity: SocialLinkTemplate, read: true}
      - {entity: SocialPost, read: true, write: true}
      - {entity: SocialPublication, read: true, write: true, export: true}
      - {entity: SocialInsight, read: true, export: true}
      - {entity: SocialMetric, read: true, export: true}
      - {entity: SocialMessage, read: true, write: true, create: true}
      - {entity: SocialReply, read: true}
  - name: Social Manager
    description: Keeps the brands and their accounts.
    permissions:
      - {entity: SocialBrand, read: true, write: true, create: true}
      - {entity: SocialAccount, read: true, write: true, create: true}
      - {entity: SocialProfile, read: true, write: true, create: true}
      - {entity: SocialSavedReply, read: true, write: true, create: true, delete: true}
      - {entity: SocialSettings, read: true, write: true, create: true}
      - {entity: SocialPostingTime, read: true, write: true, create: true, delete: true}
      - {entity: SocialTemplate, read: true, write: true, create: true, delete: true}
      - {entity: SocialSet, read: true, write: true, create: true, delete: true}
      - {entity: SocialSnippet, read: true, write: true, create: true, delete: true}
      - {entity: SocialSignature, read: true, write: true, create: true, delete: true}
      - {entity: SocialVariable, read: true, write: true, create: true, delete: true}
      - {entity: SocialReview, read: true}
      - {entity: SocialMediaAsset, read: true, write: true, create: true, delete: true}
      - {entity: SocialLinkTemplate, read: true, write: true, create: true, delete: true}
      - {entity: SocialWritingPreset, read: true, write: true, create: true, delete: true}
      - {entity: SocialWritingUse, read: true, export: true}
      - {entity: SocialPost, read: true}
      - {entity: SocialPublication, read: true, write: true, export: true}
      - {entity: SocialInsight, read: true, export: true}
      - {entity: SocialMetric, read: true, export: true}
      - {entity: SocialMessage, read: true, write: true, create: true}
      - {entity: SocialReply, read: true}

# What the inbox holds of the people who write to a brand: the handle, what they said and what was
# answered. A handle that is an address (name@host) is found by it; one that is not is listed under
# the name for a person to judge.
personal_data:
  - {entity: SocialMessage, match: author, name: author, erase: [author, author_id, account_handle, text, contact_id, contact_entity]}
  - {entity: SocialReply, match: message, erase: [text, in_reply_to]}
  # Who reviewed a post through its link (the address or name it was given for) and what they said.
  # (round two) What someone asked writing help, and what came back: it may hold anything they wrote.
  - {entity: SocialWritingUse, match: by, erase: [prompt, answer]}
  - {entity: SocialReview, match: reviewer, name: reviewer_name, erase: [reviewer, reviewer_name, text]}

# What the networks took in a post before network profiles were records: the same numbers, now
# editable. An account whose network is named like one of them is linked to it by the upkeep.
seed:
  - entity: SocialWritingPreset
    key: [preset_name]
    records:
      - {preset_name: Shorter, instruction: "Make it shorter, keeping what matters."}
      - {preset_name: Longer, instruction: "Make it longer, adding a useful detail, not filler."}
      - {preset_name: Friendlier, instruction: "Make it warmer and friendlier."}
      - {preset_name: More Formal, instruction: "Make it more formal."}
      - {preset_name: Fix Grammar, instruction: "Correct spelling and grammar only; change nothing else."}
  - entity: SocialProfile
    key: [profile_name]
    records:
      - {profile_name: X, max_text: 280, link_length: 23, images: true, max_media: 4}
      - {profile_name: Bluesky, max_text: 300, images: true, max_image_bytes: 1000000}
      - {profile_name: Mastodon, max_text: 500, images: true}
      - {profile_name: Threads, max_text: 500, images: true}
      - {profile_name: LinkedIn, max_text: 3000, images: true}
      - {profile_name: Facebook, max_text: 63206, images: true}
      - {profile_name: Instagram, max_text: 2200, images: true, media_required: true}
      - {profile_name: YouTube, max_text: 2200, images: false, videos: true, media_required: true}

# What the earlier releases had connectors for: the descriptions, as data. An account carried over from one of them is given
# its connection from here (turned off); docs/connectors/ holds the same descriptions with the network's pages that
# were read. A workspace sees them offered in Administration, Connections.
connections:
  - {"name": "mastodon", "label": "Mastodon", "description": {"base": "https://mastodon.example", "auth": {"type": "oauth", "owner": "workspace", "provider": {"authorize_url": "https://mastodon.example/oauth/authorize", "token_url": "https://mastodon.example/oauth/token", "revoke_url": "https://mastodon.example/oauth/revoke", "scopes": ["read", "write"], "client_id": "REPLACE-WITH-THE-APPS-CLIENT-ID", "client_secret": "client_secret", "client_auth": "body"}}, "apps": ["social"], "meta": {"carries": {"network": "Mastodon", "provider": "mastodon", "server": "instance", "placeholder": "https://mastodon.example"}, "capabilities": {"name": "Mastodon", "max_text": 500, "images": true, "max_media": 4, "alt_text": true, "first_comment": true, "html_text": true}}, "operations": {"publish": {"method": "POST", "path": "/api/v1/statuses", "body": "{\"status\": {{ inputs.text_with_link | json }}, \"media_ids\": {{ inputs.media | json }}}", "result": {"id": "/id", "url": "/url"}, "error_at": "/error", "idempotency_header": "Idempotency-Key", "inputs": ["text_with_link", "media"]}, "publish_media": {"method": "POST", "path": "/api/v2/media", "form": {"file": {"file": "{{ inputs.file }}", "name": "{{ inputs.name }}"}, "description": "{{ inputs.alt }}"}, "result": {"id": "/id"}, "error_at": "/error", "inputs": ["file", "name", "alt"], "idempotency_header": "Idempotency-Key"}, "delete": {"method": "DELETE", "path": "/api/v1/statuses/{{ inputs.id }}", "error_at": "/error", "inputs": ["id"], "idempotency_header": "Idempotency-Key"}, "reply": {"method": "POST", "path": "/api/v1/statuses", "body": "{\"status\": {% if inputs.author and ('@' ~ inputs.author) not in inputs.text %}{{ ('@' ~ inputs.author ~ ' ' ~ inputs.text) | json }}{% else %}{{ inputs.text | json }}{% endif %}, \"in_reply_to_id\": {{ inputs.in_reply_to | json }}{% if inputs.thread %}, \"visibility\": {{ inputs.thread | json }}{% endif %}}", "result": {"id": "/id"}, "error_at": "/error", "idempotency_header": "Idempotency-Key", "inputs": ["text", "in_reply_to", "author", "thread"]}, "send_message": {"method": "POST", "path": "/api/v1/statuses", "body": "{\"status\": {{ ('@' ~ inputs.author ~ ' ' ~ inputs.text) | json }}, \"visibility\": \"direct\", \"in_reply_to_id\": {{ inputs.in_reply_to | json }}}", "result": {"id": "/id"}, "error_at": "/error", "idempotency_header": "Idempotency-Key", "inputs": ["text", "in_reply_to", "author"]}, "metrics": {"path": "/api/v1/statuses/{{ inputs.id }}", "result": {"engagements": {"expr": "answer.favourites_count + answer.reblogs_count + answer.replies_count"}}, "error_at": "/error", "inputs": ["id"]}, "account": {"path": "/api/v1/accounts/verify_credentials", "result": {"followers": "/followers_count"}, "error_at": "/error"}, "messages": {"path": "/api/v1/notifications", "query": {"types[]": "mention", "limit": "40"}, "error_at": "/error"}}, "pulls": [{"name": "mentions", "operation": "messages", "every_minutes": 15, "items_at": "", "cursor": "token", "next_at": {"link": "prev"}, "max_pages": 3, "map": {"entity": "SocialMessage", "outside": true, "by": {"external_id": "/status/id"}, "set": {"kind": "item.status.visibility == 'direct' ? 'Direct' : 'Mention'", "author": "/account/acct", "author_id": "/account/id", "text": "/status/content", "thread": "/status/visibility", "post_external_id": "/status/in_reply_to_id", "via_connection": "connection.id"}}}]}}
  - {"name": "bluesky", "label": "Bluesky", "description": {"base": "https://bsky.social/xrpc", "auth": {"type": "session", "login": "create_session", "refresh": "refresh_session", "token_at": "/accessJwt", "refresh_at": "/refreshJwt"}, "apps": ["social"], "meta": {"carries": {"network": "Bluesky", "provider": "bluesky", "server": "service", "placeholder": "https://bsky.social"}, "capabilities": {"name": "Bluesky", "max_text": 300, "images": true, "max_media": 4, "max_image_bytes": 2000000, "alt_text": true, "first_comment": false}}, "operations": {"create_session": {"method": "POST", "path": "/com.atproto.server.createSession", "changes": false, "body": "{\"identifier\": {{ secret.handle | json }}, \"password\": {{ secret.app_password | json }}}", "error_at": "/message"}, "refresh_session": {"method": "POST", "path": "/com.atproto.server.refreshSession", "body": "{}", "changes": false, "headers": {"authorization": "Bearer {{ inputs.refresh_token }}"}, "error_at": "/message"}, "publish": {"method": "POST", "path": "/com.atproto.repo.createRecord", "body": "{\"repo\": {{ secret.handle | json }}, \"collection\": \"app.bsky.feed.post\", \"record\": {\"$type\": \"app.bsky.feed.post\", \"text\": {% if inputs.link and not inputs.media_id %}{{ inputs.text | json }}{% else %}{{ inputs.text_with_link | json }}{% endif %}, \"createdAt\": {{ inputs.created_at | json }}{% if inputs.media_id %}, \"embed\": {\"$type\": \"app.bsky.embed.images\", \"images\": [{\"alt\": {{ inputs.alt | json }}, \"image\": {\"$type\": \"blob\", \"ref\": {\"$link\": {{ inputs.media_id | json }}}, \"mimeType\": {{ inputs.picture_type | json }}, \"size\": {{ inputs.picture_size | json }}}}]}{% elif inputs.link %}, \"embed\": {\"$type\": \"app.bsky.embed.external\", \"external\": {\"uri\": {{ inputs.link | json }}, \"title\": {{ inputs.link | json }}, \"description\": \"\"}}{% endif %}}}", "result": {"id": "/uri"}, "error_at": "/message", "inputs": ["text", "link", "text_with_link", "media_id", "alt", "created_at", "picture_type", "picture_size"], "idempotency_header": "Idempotency-Key"}, "publish_media": {"method": "POST", "path": "/com.atproto.repo.uploadBlob", "body": {"file": "{{ inputs.file }}"}, "result": {"id": "/blob/ref/$link"}, "error_at": "/message", "inputs": ["file"], "idempotency_header": "Idempotency-Key"}, "delete": {"method": "POST", "path": "/com.atproto.repo.deleteRecord", "body": "{\"repo\": {{ secret.handle | json }}, \"collection\": \"app.bsky.feed.post\", \"rkey\": {{ inputs.id | split('/') | last | json }}}", "error_at": "/message", "inputs": ["id"], "idempotency_header": "Idempotency-Key"}, "reply": {"method": "POST", "path": "/com.atproto.repo.createRecord", "body": "{% set t = inputs.thread | split(' ') %}{\"repo\": {{ secret.handle | json }}, \"collection\": \"app.bsky.feed.post\", \"record\": {\"$type\": \"app.bsky.feed.post\", \"text\": {{ inputs.text | json }}, \"createdAt\": {{ inputs.created_at | json }}, \"reply\": {\"root\": {\"uri\": {{ t[0] | json }}, \"cid\": {{ t[1] | json }}}, \"parent\": {\"uri\": {{ inputs.in_reply_to | json }}, \"cid\": {{ t[2] | json }}}}}}", "result": {"id": "/uri"}, "error_at": "/message", "inputs": ["text", "in_reply_to", "thread", "created_at"], "idempotency_header": "Idempotency-Key"}, "metrics": {"path": "/app.bsky.feed.getPosts", "query": {"uris": "{{ inputs.id }}"}, "result": {"engagements": {"expr": "answer.posts[0].likeCount + answer.posts[0].repostCount + answer.posts[0].replyCount + answer.posts[0].quoteCount"}}, "error_at": "/message", "inputs": ["id"]}, "account": {"path": "/app.bsky.actor.getProfile", "query": {"actor": "{{ secret.handle }}"}, "result": {"followers": "/followersCount"}, "error_at": "/message"}, "messages": {"path": "/app.bsky.notification.listNotifications?reasons=reply&reasons=mention&reasons=quote", "query": {"limit": "50"}, "error_at": "/message"}}, "pulls": [{"name": "notifications", "operation": "messages", "every_minutes": 15, "items_at": "/notifications", "cursor": "time", "max_pages": 1, "map": {"entity": "SocialMessage", "outside": true, "by": {"external_id": "/uri"}, "set": {"kind": "item.reason == 'reply' ? 'Comment' : 'Mention'", "author": "/author/handle", "author_id": "/author/did", "text": "/record/text", "post_external_id": "/reasonSubject", "thread": "has(item.record.reply) ? item.record.reply.root.uri + ' ' + item.record.reply.root.cid + ' ' + item.cid : item.uri + ' ' + item.cid + ' ' + item.cid", "via_connection": "connection.id"}}}]}}

# A post's review: the default reproduces 0.7.0's rule (one step, a Social Approver, never the author, who asks). A
# workspace edits it (steps, approvers by brand, N of M) in Customize; a change to what was asked about voids decisions.
approvals:
  - entity: SocialPost
    on: {action: review}
    policy:
      steps:
        - {label: Social Approver, approvers: {role: Social Approver}}
      reset_on: [text, link, image, image_alt, first_comment, targets, items, media, scheduled_at, add_signature, signature]

# Told once to the workspace's administrators when an upgrade made connections for accounts that need connecting again.
messages:
  - key: social.reconnect
    label: Social accounts to connect again
    category: operational
    channels: [inapp]
    values: [count, accounts]
    languages:
      en:
        inapp:
          title: "{{ values.count }} Social account{% if values.count != 1 %}s{% endif %} to connect again"
          text: "{% for a in values.accounts %}{{ a.account }}: in Administration, Connections, add the secrets of {{ a.label }} and turn it on, then Connect the account in Social.{% if not loop.last %} {% endif %}{% endfor %}"
  # A review link for someone outside: what the post is and where to look at it.
  - key: social.review_link
    label: A post to review
    category: operational
    entity: SocialPost
    channels: [email]
    values: [url, expires_at, from, name]
    languages:
      en:
        email:
          subject: "{{ values.from }} asks you to look at a post: {{ doc.headline }}"
          body: "<p>Hello{% if values.name %} {{ values.name }}{% endif %},</p><p>{{ values.from }} would like to know what you think of a post before it goes out{% if doc.scheduled_at %}, at {{ doc.scheduled_at }}{% endif %}: <a href=\"{{ values.url }}\">look at it here</a>. The link works until {{ values.expires_at }}.</p>"

  # (round two) What writing help asks, a workspace editing the words (read for the person asking, never sent).
  - {"key": "social.prompt_system", "label": "Writing help: what it is told first", "category": "operational", "channels": ["email"], "values": ["brand", "voice"], "languages": {"en": {"email": {"subject": "Writing help: what it is told first", "body": "<p>Writing help: what it is told first</p>"}, "text": {"text": "You write social media posts{% if values.brand %} for {{ values.brand }}{% endif %}.{% if values.voice %} How it speaks: {{ values.voice }}{% endif %} Answer with the text asked for and nothing else."}}}}
  - {"key": "social.prompt_write", "label": "Writing help: write a post", "category": "operational", "channels": ["email"], "values": ["brand", "voice", "prompt"], "languages": {"en": {"email": {"subject": "Writing help: write a post", "body": "<p>Writing help: write a post</p>"}, "text": {"text": "Write a social media post about: {{ values.prompt }}"}}}}
  - {"key": "social.prompt_rewrite", "label": "Writing help: rewrite a post", "category": "operational", "channels": ["email"], "values": ["brand", "voice", "instruction", "text"], "languages": {"en": {"email": {"subject": "Writing help: rewrite a post", "body": "<p>Writing help: rewrite a post</p>"}, "text": {"text": "Rewrite this post. {{ values.instruction }}\n\n{{ values.text }}"}}}}
  - {"key": "social.prompt_adapt", "label": "Writing help: adapt a post for a network", "category": "operational", "channels": ["email"], "values": ["brand", "voice", "network", "max", "format", "kind", "text"], "languages": {"en": {"email": {"subject": "Writing help: adapt a post for a network", "body": "<p>Writing help: adapt a post for a network</p>"}, "text": {"text": "Adapt this post for {{ values.network }}{% if values.kind %} as a {{ values.kind }}{% endif %}{% if values.max %}, in at most {{ values.max }} characters{% endif %}, written as {{ values.format }} text.\n\n{{ values.text }}"}}}}
  - {"key": "social.prompt_hashtags", "label": "Writing help: hashtags", "category": "operational", "channels": ["email"], "values": ["brand", "voice", "text", "count"], "languages": {"en": {"email": {"subject": "Writing help: hashtags", "body": "<p>Writing help: hashtags</p>"}, "text": {"text": "Suggest {{ values.count }} hashtags for this post, each starting with #, separated by spaces.\n\n{{ values.text }}"}}}}
  - {"key": "social.prompt_alt", "label": "Writing help: describe a picture", "category": "operational", "channels": ["email"], "values": ["brand", "voice", "text"], "languages": {"en": {"email": {"subject": "Writing help: describe a picture", "body": "<p>Writing help: describe a picture</p>"}, "text": {"text": "Describe this picture for someone who cannot see it, in one or two sentences, for a post that says: {{ values.text }}"}}}}
  - {"key": "social.prompt_thread", "label": "Writing help: split into a thread", "category": "operational", "channels": ["email"], "values": ["brand", "voice", "text", "parts"], "languages": {"en": {"email": {"subject": "Writing help: split into a thread", "body": "<p>Writing help: split into a thread</p>"}, "text": {"text": "Split this into a thread of {{ values.parts }} posts, each on its own, separated by a line holding only ---.\n\n{{ values.text }}"}}}}
  - {"key": "social.prompt_picture", "label": "Writing help: a picture", "category": "operational", "channels": ["email"], "values": ["brand", "voice", "prompt"], "languages": {"en": {"email": {"subject": "Writing help: a picture", "body": "<p>Writing help: a picture</p>"}, "text": {"text": "A picture for a social media post{% if values.brand %} by {{ values.brand }}{% endif %}: {{ values.prompt }}"}}}}
