- name: SocialBrand
  label: Brand
  label_plural: Brands
  kind: master
  module: social
  title_field: brand_name
  description: A brand the team speaks for, with its accounts on each network.
  fields:
    - {name: brand_name, type: data, required: true, unique: true, in_list: true}
    - {name: description, type: text}
  list: {columns: [brand_name], sort: brand_name asc}

- name: SocialProfile
  label: Network Profile
  label_plural: Network Profiles
  kind: master
  module: social
  title_field: profile_name
  description: "What one network takes in a post: its length and how it counts a link, the pictures and video it takes, and what else it offers. An account names one; a post is checked against it before it is scheduled."
  fields:
    - {name: profile_name, type: data, required: true, unique: true, in_list: true, description: "What people call the network"}
    - {name: max_text, type: int, required: true, min: 1, in_list: true, label: Characters in a Post}
    - {name: link_length, type: int, min: 1, label: A Link Counts As, description: "Characters a link counts as whatever its length, for a network that shortens them; empty: as written"}
    - {name: images, type: check, default: true, in_list: true, label: Takes Pictures}
    - {name: videos, type: check, default: false, label: Takes Video, description: "Posts here do not carry video yet, so a network that takes nothing else is refused, saying so"}
    - {name: media_required, type: check, default: false, label: Takes No Post Without Media}
    - {name: max_media, type: int, min: 1, label: Most Pictures in a Post, description: "Empty: not limited here"}
    - {name: max_image_bytes, type: int, min: 1, label: Largest Picture (Bytes), description: "Empty: not limited here"}
    - {name: max_video_bytes, type: int, min: 1, label: Largest Video (Bytes)}
    - {name: alt_text, type: check, default: true, label: Takes a Description of Each Picture}
    - {name: first_comment, type: check, default: false, label: Takes a First Comment}
    - {name: threads, type: check, default: false, label: Takes Threads}
    - {name: link_preview, type: check, default: false, label: Shows a Preview of a Link}
    - {name: scheduling, type: check, default: false, label: Schedules Posts Itself, description: "Recorded only: Social always sends a post at its time itself"}
  list: {columns: [profile_name, max_text, images, videos], sort: profile_name asc}

- name: SocialSettings
  label: Social Settings
  kind: settings
  module: social
  description: "How the inbox finds the person who wrote."
  fields:
    - {name: match_crm, type: check, default: false, label: Match a Sender to a CRM Record, description: "A message whose sender's handle is held by a record of the entity below is linked to it; needs that entity installed"}
    - {name: crm_entity, type: data, default: Lead, label: Entity That Holds People}
    - {name: crm_field, type: data, label: Field That Holds a Handle, description: "The field of that entity holding a person's handle on the network, as the message gives it; empty switches matching off"}
    - {name: metrics_days, type: int, default: 30, min: 1, max: 366, label: Read a Post's Numbers For (Days), description: "How long after it went out each post's numbers are read"}
    - {name: metrics_hours, type: int, default: 6, min: 1, max: 168, label: Read Again After (Hours), description: "The soonest an account's or a post's numbers are read again"}

- name: SocialSavedReply
  label: Saved Reply
  label_plural: Saved Replies
  kind: master
  module: social
  title_field: title
  description: A reply written once, to be sent to a message with one click.
  fields:
    - {name: title, type: data, required: true, unique: true, in_list: true}
    - {name: text, type: text, required: true}
  list: {columns: [title], sort: title asc}

- name: SocialAccount
  label: Account
  label_plural: Accounts
  kind: master
  module: social
  title_field: account_name
  description: A brand's account on one network, reached through a connection (the workspace's sign-in, or a person's, through the broker). What a post may carry is what its network profile says; what it may do is what the connection's operations offer.
  fields:
    - {name: account_name, type: data, required: true, unique: true, in_list: true}
    - {name: brand, type: link, to: SocialBrand, required: true, in_list: true, in_filter: true}
    - {name: network, type: data, in_list: true, in_filter: true, description: "What people call the network; the profile's name when left empty"}
    - {name: profile, type: link, to: SocialProfile, in_list: true, description: "What the network takes in a post"}
    - {name: handle, type: data, required: true, description: "The account's name on the network, without @"}
    - {name: connection, type: data, required: true, description: "The connection that reaches it: its name, as Administration, Connections shows it, or its id"}
    - {name: connected_by, type: email, description: "Whose own sign-in the connection uses, when it is each person's own; posts then go out as them"}
    - {name: state, type: select, options: [Connected, Needs Reconnecting, Not Connected, Connection Off], read_only: true, no_copy: true, in_list: true, in_filter: true, description: "Whether the connection can reach the account now; the provider refusing a sign-in shows here"}
    - {name: state_note, type: text, read_only: true, no_copy: true}
    - {name: provider_account, type: data, read_only: true, no_copy: true, description: "The account the provider says is signed in"}
    - {name: metrics_error, type: text, read_only: true, no_copy: true, description: "Why its numbers could not be read the last time, if they could not"}
    - {name: active, type: check, default: true, in_list: true}
  actions:
    - {name: check, label: Check the Connection, permission: write}
    - {name: connect, label: Connect or Reconnect, permission: write, read_only: true}
    - {name: disconnect, label: Disconnect, permission: write, confirm: "Sign this account out? The provider is told to revoke its access."}
  list: {columns: [account_name, brand, network, state, active], sort: account_name asc}

- name: SocialTarget
  label: Account
  kind: child
  fields:
    - {name: account, type: link, to: SocialAccount, required: true, in_list: true}

- name: SocialPost
  label: Post
  label_plural: Posts
  kind: master
  module: social
  title_field: headline
  description: What a brand says, to one or more of its accounts, at a time. Someone other than its author approves it; it goes out at its time.
  fields:
    - {name: headline, type: data, required: true, in_list: true, description: "What the team calls it"}
    - {name: brand, type: link, to: SocialBrand, required: true, in_list: true, in_filter: true}
    - {name: text, type: text, required: true}
    - {name: link, type: data, description: "A web address the post carries"}
    - {name: image, type: attach, description: "A picture the post carries, to the networks that take one"}
    - {name: image_alt, type: data, label: Image Description, description: "What the picture shows, for people who cannot see it"}
    - {name: first_comment, type: text, description: "Added under the post right after it goes out, to the networks that take one"}
    - {name: targets, type: table, of: SocialTarget, required: true}
    - {name: scheduled_at, type: datetime, required: true, in_list: true, label: Goes Out At}
    - {name: author, type: email, read_only: true, no_copy: true, in_list: true}
    - {name: status, type: select, options: [Draft, In Review, Approved, Rejected, Sending, Published, Failed], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: approved_by, type: email, read_only: true, no_copy: true}
    - {name: approved_hash, type: data, read_only: true, no_copy: true, hidden: true}
    - {name: review_note, type: text, read_only: true, no_copy: true}
    - {name: published_at, type: datetime, read_only: true, no_copy: true}
    - {name: waiting_for, type: text, read_only: true, no_copy: true, label: Waiting For, visible_if: "!isEmpty(doc.waiting_for)", description: "Approved and due, but not sent: an account it goes to cannot be reached yet (not connected, its sign-in refused, or its connection off). It goes when every account can be."}
    - {name: failure, type: text, read_only: true, no_copy: true, visible_if: "doc.status == 'Failed'", description: "What each account's network said when it would not take the post"}
  actions:
    - {name: send_for_review, label: Send for Review, permission: write, condition: "doc.status == 'Draft' || doc.status == 'Rejected'"}
    - {name: approve, label: Approve It, permission: write, condition: "doc.status == 'In Review'"}
    - {name: reject, label: Send It Back, permission: write, condition: "doc.status == 'In Review'", params: [{name: note, type: text, label: Why}]}
    - {name: retry, label: Retry, permission: write, condition: "doc.status == 'Failed'", confirm: "Send it again to the accounts it did not reach?"}
  list: {columns: [headline, brand, scheduled_at, status], sort: scheduled_at desc}

- name: SocialPublication
  label: Publication
  label_plural: Publications
  kind: master
  module: social
  title_field: post
  description: A post as it went to one account, sent through that account's connection and known by the network's id once out; or one made on the network itself, read back through a connection. What it did is read back with it.
  fields:
    - {name: post, type: link, to: SocialPost, read_only: true, in_list: true, in_filter: true}
    - {name: account, type: link, to: SocialAccount, read_only: true, in_list: true, in_filter: true}
    - {name: text, type: text, read_only: true}
    - {name: link, type: data, read_only: true}
    - {name: image, type: attach, read_only: true}
    - {name: image_alt, type: data, read_only: true, label: Image Description}
    - {name: external_id, type: data, read_only: true, no_copy: true, in_list: true, description: "The network's id for it, once out"}
    - {name: sent_at, type: datetime, read_only: true, no_copy: true, in_list: true}
    - {name: failed_at, type: datetime, read_only: true, no_copy: true, description: "When the network last refused it, or sending gave up"}
    - {name: failure, type: text, read_only: true, no_copy: true, in_list: true, description: "The network's reason, while it is not out"}
    - {name: impressions, type: int, read_only: true, no_copy: true, in_list: true}
    - {name: engagements, type: int, read_only: true, no_copy: true, in_list: true}
    - {name: clicks, type: int, read_only: true, no_copy: true}
    - {name: permalink, type: data, read_only: true, no_copy: true}
    - {name: media_ref, type: data, read_only: true, no_copy: true, hidden: true, description: "The network's id of the picture once uploaded"}
    - {name: deleted_at, type: datetime, read_only: true, no_copy: true, description: "When it was deleted on the network"}
  actions:
    - {name: delete_remote, label: Delete on the Network, permission: write, condition: "!isEmpty(doc.external_id) && isEmpty(doc.deleted_at)", confirm: "Delete this post from the network? It cannot be put back from here."}
  list: {columns: [post, account, external_id, impressions, engagements], sort: sent_at desc}

- name: SocialInsight
  label: Daily Insight
  label_plural: Daily Insights
  kind: master
  module: social
  title_field: publication
  description: What a publication had done by a day, as read back through its connection. A row is kept for each day its numbers changed, holding the day's last ones, so its history stays while the network shows only the latest.
  fields:
    - {name: publication, type: link, to: SocialPublication, required: true, read_only: true, in_list: true, in_filter: true}
    - {name: account, type: link, to: SocialAccount, read_only: true, in_list: true, in_filter: true}
    - {name: post, type: link, to: SocialPost, read_only: true, in_filter: true}
    - {name: day, type: date, required: true, read_only: true, in_list: true, in_filter: true}
    - {name: impressions, type: int, read_only: true, in_list: true}
    - {name: engagements, type: int, read_only: true, in_list: true}
    - {name: clicks, type: int, read_only: true}
  unique: [[publication, day]]
  list: {columns: [day, publication, account, impressions, engagements], sort: day desc}

- name: SocialMetric
  label: Metric
  label_plural: Metrics
  kind: master
  module: social
  title_field: day
  description: "What an account or one of its posts had by a day, read through its connection: impressions, reach, engagements, clicks and followers, whatever the network calls them. One row a day for each."
  fields:
    - {name: metric_key, type: data, required: true, read_only: true, hidden: true, unique: true}
    - {name: account, type: link, to: SocialAccount, required: true, read_only: true, in_list: true, in_filter: true}
    - {name: publication, type: link, to: SocialPublication, read_only: true, in_list: true, in_filter: true, description: "Empty for the account's own numbers"}
    - {name: day, type: date, required: true, read_only: true, in_list: true, in_filter: true}
    - {name: impressions, type: int, read_only: true, in_list: true}
    - {name: reach, type: int, read_only: true}
    - {name: engagements, type: int, read_only: true, in_list: true}
    - {name: clicks, type: int, read_only: true}
    - {name: followers, type: int, read_only: true}
    - {name: read_at, type: datetime, read_only: true, description: "When the network was last asked, which the next reading waits on"}
  list: {columns: [day, account, publication, impressions, engagements, followers], sort: day desc}

- name: SocialMessage
  label: Message
  label_plural: Inbox
  kind: master
  module: social
  title_field: author
  description: A comment, mention or direct message to one of the brand's accounts, read through its connection, and handled by someone.
  fields:
    - {name: external_id, type: data, no_copy: true, description: "The network's id for it: what keeps one message from arriving twice. Not read-only: a pull on a person's own connection is written as that person, and read-only fields would be dropped"}
    - {name: account_handle, type: data, description: "The account it came to, when the network says"}
    - {name: account, type: link, to: SocialAccount, in_list: true, in_filter: true, description: "Found by the handle, or by the post it answers; set it by hand when neither says"}
    - {name: thread, type: data, description: "The network's conversation it belongs to"}
    - {name: kind, type: select, options: [Comment, Mention, Direct], default: Comment, in_list: true, in_filter: true}
    - {name: author, type: data, required: true, in_list: true, description: "The sender's handle"}
    - {name: author_id, type: data, description: "The sender's id on the network, where a direct reply needs it"}
    - {name: text, type: text, required: true}
    - {name: contact_entity, type: data, read_only: true, no_copy: true}
    - {name: contact_id, type: data, read_only: true, no_copy: true, description: "The record of the person who wrote, when Social Settings match senders to one"}
    - {name: post_external_id, type: data, description: "The post it answers, when it is a comment"}
    - {name: via_connection, type: data, no_copy: true, hidden: true, description: "The connection it was read through: where neither the handle nor the post names an account, the one account that connection reaches (for a person's own, the one she connected)"}
    - {name: status, type: select, options: [New, Assigned, Answered, Closed], default: New, in_list: true, in_filter: true}
    - {name: assigned_to, type: email, in_list: true, in_filter: true}
  actions:
    - {name: reply, label: Reply, permission: write, condition: "doc.status != 'Closed'", params: [{name: reply, type: text, label: Your Reply}, {name: saved_reply, type: link, to: SocialSavedReply, label: Or a Saved Reply}]}
  list: {columns: [author, account, kind, status, assigned_to], sort: updated_at desc}

- name: SocialReply
  label: Reply
  label_plural: Replies
  kind: master
  module: social
  title_field: message
  description: An answer to a message, sent through its account's connection.
  fields:
    - {name: message, type: link, to: SocialMessage, required: true, in_list: true}
    - {name: text, type: text, required: true}
    - {name: in_reply_to, type: data, read_only: true, description: "The network's id of the message"}
    - {name: author, type: email, read_only: true, no_copy: true, in_list: true}
    - {name: external_id, type: data, read_only: true, no_copy: true}
    - {name: failed_at, type: datetime, read_only: true, no_copy: true}
    - {name: failure, type: text, read_only: true, no_copy: true, description: "What the network said when it would not take the reply"}
  list: {columns: [message, author, external_id], sort: created_at desc}
